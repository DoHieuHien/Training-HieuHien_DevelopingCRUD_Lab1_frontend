<a routerLink="/list">← Quay lại danh sách</a>
<h2>Detail data</h2>

@if (error()) { <p style="color:#dc2626">{{ error() }}</p> }

@if (record(); as r) {
  <table border="1" cellpadding="6" cellspacing="0">
    <tr><th align="left">ID</th><td>{{ r.id }}</td></tr>
    <tr><th align="left">Title</th><td>{{ r.title }}</td></tr>
    @for (item of r.payload | keyvalue; track item.key) {
      <tr><th align="left">{{ item.key }}</th><td>{{ item.value }}</td></tr>
    }
  </table>
}
